version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: sentraclass_db
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
      POSTGRES_DB: sentraclass_db
    ports:
      - "5434:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d sentraclass_db"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data: